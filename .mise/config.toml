[tools]
periphery = "3.8.0"
swiftformat = "0.64.7"
lefthook = "2.2.2"
jactionlint = { version = "v2.6.0", workflow = "release.yaml" }
oxfmt = "0.78.0"
shellcheck = "0.11.0"

[settings]
experimental = true
pin = true
lockfile = true

[tasks.format]
run = "swiftformat PTouchBridge PTouchBridgeTests"

[tasks.fmt-check]
run = "swiftformat PTouchBridge PTouchBridgeTests --lint"

[tasks.build]
description = "Unsigned"
run = """
xcodebuild build \
  -project PTouchBridge.xcodeproj \
  -scheme PTouchBridge \
  -configuration Release \
  -destination 'generic/platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.periphery]
run = """
periphery scan \
  --project PTouchBridge.xcodeproj \
  --schemes PTouchBridge \
  --format xcode \
  --strict \
  --disable-update-check \
  --relative-results \
  -- \
  -destination 'platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.test]
run = """
xcodebuild test \
  -project PTouchBridge.xcodeproj \
  -scheme PTouchBridge \
  -destination 'platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.shell-lint]
run = "shellcheck packaging/scripts/*"

[tasks.plist-lint]
run = "plutil -lint Config/*.plist packaging/root/Library/LaunchAgents/*.plist"

[tasks.lint]
depends = ["shell-lint", "plist-lint", "periphery"]

[hooks]
postinstall = "lefthook install"
