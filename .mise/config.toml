[tools]
periphery = "3.8.0"
swiftformat = "0.64.6"
lefthook = "2.2.2"
jactionlint = { version = "2.5.0", workflow = "release.yaml" }
oxfmt = "0.78.0"
shellcheck = "0.11.0"

[settings]
experimental = true
pin = true
lockfile = true

[tasks.format]
run = "swiftformat PTouchBridge PTouchBridgeTests"

[tasks.fmt-check]
run = "swiftformat PTouchBridge PTouchBridgeTests --lint"

[tasks.build]
description = "Build the unsigned background service"
run = """
xcodebuild build \
  -project PTouchBridge.xcodeproj \
  -scheme PTouchBridge \
  -configuration Release \
  -destination 'generic/platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.periphery]
description = "Build the app and reject unused Swift code"
run = """
periphery scan \
  --project PTouchBridge.xcodeproj \
  --schemes PTouchBridge \
  --format xcode \
  --strict \
  --disable-update-check \
  --relative-results \
  -- \
  -destination 'platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.test]
description = "Run the macOS test suite"
run = """
xcodebuild test \
  -project PTouchBridge.xcodeproj \
  -scheme PTouchBridge \
  -destination 'platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.shell-lint]
description = "Lint package scripts"
run = "shellcheck packaging/scripts/*"

[tasks.plist-lint]
description = "Lint property lists"
run = "plutil -lint Config/*.plist packaging/root/Library/LaunchAgents/*.plist"

[tasks.lint]
description = "Check Swift code, shell scripts and property lists"
depends = ["shell-lint", "plist-lint", "periphery"]

[hooks]
postinstall = "lefthook install"
